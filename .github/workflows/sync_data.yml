name: Genesis Live Benchmark Synchronization & Truth Verification

on:
  schedule:
    # Runs every 6 hours to check for upstream SWE-bench & HuggingFace updates
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows 1-click manual sync execution from the GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Live Benchmark Truth Engine
        run: |
          python3 sync_engine.py

      - name: Verify Data Parity & Schema Integrity
        run: |
          python3 -c "
          import json, csv
          with open('data.json') as f:
              d = json.load(f)
          assert 'benchmark_metadata' in d
          assert 'comparative_matrix' in d
          print('Data verification passed: ' + str(len(d['comparative_matrix'])) + ' benchmark rows.')
          "

      - name: Commit and Push Verified Synchronized Datasets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Genesis Autonomous Truth Daemon"
          if [ -n "$(git status --porcelain)" ]; then
            git add index.html data.json dataset.csv llms.txt sync_audit_log.json
            git commit -m "chore(sync): automated live benchmark sync from SWE-bench official dataset [skip ci]"
            git push origin HEAD
            echo "Changes successfully pushed to remote branch."
          else
            echo "No upstream changes detected; dataset remains in perfect sync."
          fi
