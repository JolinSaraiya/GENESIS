name: Kora Threads Autonomous Ground Truth & Parity Sync

on:
  schedule:
    # Runs automatically every 6 hours to verify upstream parity & live sync
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows 1-click manual sync execution from the GitHub Actions UI
  repository_dispatch:
    # Allows external webhooks (e.g. inventory or supplier updates) to trigger instant sync
    types: [upstream-data-change, inventory-update]

permissions:
  contents: write

jobs:
  sync-ground-truth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Monitor Upstream Official Sources & Live Registries
        run: |
          python3 upstream_monitor.py

      - name: Run Ground Truth Synchronization Engine
        run: |
          python3 sync_engine.py

      - name: Run Automated IEEE Std 829 Verification Suite
        run: |
          python3 test_phase3.py

      - name: Commit and Push Verified Synchronized Datasets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Kora Threads Autonomous Truth Daemon"
          if [ -n "$(git status --porcelain)" ]; then
            git add data.json dataset.csv llms.txt sync_audit_log.json index.html upstream_status.json
            git commit -m "chore(sync): automated live ground truth sync and parity audit [skip ci]"
            git push origin HEAD
            echo "Changes successfully pushed to remote branch."
            python3 indexnow.py || true
          else
            echo "No upstream changes detected; dataset remains in perfect sync."
          fi
